
name: Sync GitHub Plugins

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Clone Station Logos
        run: |
          git clone --depth 1 \
            https://github.com/Highpoint2000/webserver-station-logos.git \
            /tmp/StationLogos

      - name: Clone LiveMap
        run: |
          git clone --depth 1 \
            https://github.com/Highpoint2000/LiveMap.git \
            /tmp/LiveMap

      - name: Create destination folders
        run: |
          mkdir -p plugins/StationLogos
          mkdir -p plugins/LiveMap

      - name: Sync Station Logos
        run: |
          rsync -av \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            /tmp/StationLogos/ \
            plugins/StationLogos/

      - name: Sync LiveMap
        run: |
          rsync -av \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            --exclude='/LiveMapQuickGuide.pdf' \
            /tmp/LiveMap/ \
            plugins/LiveMap/

      - name: Verify copied files
        run: |
          echo "StationLogos files:"
          find plugins/StationLogos -type f

          echo "LiveMap files:"
          find plugins/LiveMap -type f

          test -n "$(find plugins/StationLogos -type f -print -quit)" || {
            echo "ERROR: StationLogos is empty!"
            exit 1
          }

          test -n "$(find plugins/LiveMap -type f -print -quit)" || {
            echo "ERROR: LiveMap is empty!"
            exit 1
          }

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add plugins/

          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync GitHub plugins"
            git push
          else
            echo "No changes to synchronize"
          fi
