
name: Sync GitHub Plugins

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Clone Station Logos
        run: |
          git clone --depth 1 \
            https://github.com/Highpoint2000/webserver-station-logos.git \
            /tmp/StationLogos

      - name: Clone LiveMap
        run: |
          git clone --depth 1 \
            https://github.com/Highpoint2000/LiveMap.git \
            /tmp/LiveMap

      - name: Sync Station Logos
        run: |
          mkdir -p plugins/StationLogos

          rsync -av --delete \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            /tmp/StationLogos/ plugins/StationLogos/

      - name: Sync LiveMap
        run: |
          mkdir -p plugins/LiveMap

          rsync -av --delete \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            --exclude='/LiveMapQuickGuide.pdf' \
            /tmp/LiveMap/ plugins/LiveMap/

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add plugins/

          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync GitHub plugins"
            git push
          else
            echo "No changes to synchronize"
          fi
