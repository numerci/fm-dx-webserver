
name: Sync GitHub Plugins

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Clone Station Logos
        run: |
          git clone --depth 1 \
            https://github.com/Highpoint2000/webserver-station-logos.git \
            /tmp/StationLogos

      - name: Clone LiveMap
        run: |
          git clone --depth 1 \
            https://github.com/Highpoint2000/LiveMap.git \
            /tmp/LiveMap

      - name: Clone Spectrum Graph
        run: |
          git clone --depth 1 \
            https://github.com/AmateurAudioDude/FM-DX-Webserver-Plugin-Spectrum-Graph.git \
            /tmp/SpectrumGraph

      - name: Clone S-Meter
        run: |
          git clone --depth 1 \
            https://github.com/AmateurAudioDude/FM-DX-Webserver-Plugin-S-Meter.git \
            /tmp/SMeter

      - name: Clone Weather
        run: |
          git clone --depth 1 \
            https://github.com/NoobishSVK/fm-dx-webserver-plugin-weather.git \
            /tmp/Weather

      - name: Create plugins folder
        run: mkdir -p plugins

      - name: Copy Station Logos files
        run: |
          rsync -av \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            /tmp/StationLogos/ \
            plugins/

      - name: Copy LiveMap files
        run: |
          rsync -av \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            --exclude='/LiveMapQuickGuide.pdf' \
            /tmp/LiveMap/ \
            plugins/

      - name: Copy Spectrum Graph files
        run: |
          rsync -av \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            /tmp/SpectrumGraph/ \
            plugins/

      - name: Copy S-Meter files
        run: |
          rsync -av \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            /tmp/SMeter/ \
            plugins/

      - name: Copy Weather files
        run: |
          rsync -av \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            /tmp/Weather/ \
            plugins/

      - name: Verify files
        run: |
          echo "===== PLUGINS ====="
          find plugins -type f

          test -n "$(find plugins -type f ! -name '.gitkeep' -print -quit)" || exit 1

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f plugins/

          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync GitHub plugins"
            git push
          else
            echo "No changes to synchronize"
          fi
